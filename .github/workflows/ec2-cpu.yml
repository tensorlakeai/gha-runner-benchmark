name: EC2 CPU

# CPU of each EC2 instance type RunsOn can launch: the hardware suite's CPU
# groups (sysbench, 7-Zip, PassMark) on one small instance per type. The open
# replacement for the earlier private EC2 CPU sweep; PassMark "CPU Single
# Threaded" (metrics.cpu.passmarkSingle) is the figure that sweep recorded.

on:
  # No schedule in this fork: a cron run starts every provider's default
  # runners. Dispatch with runners=<ids> instead (see TENSORLAKE.md).
  workflow_dispatch:
    inputs:
      runners:
        description: "default (the suite's runners; also when empty), all, or comma-separated runner ids. Trigger files are read on push only"
        required: false
        default: ""
      iterations:
        description: "Runs per runner, at most 5 (empty: 1)"
        required: false
        default: ""
  push:
    branches: [main, harness]
    paths:
      - triggers/ec2-cpu.json

permissions: {}

jobs:
  hardware:
    # The called workflow's jobs get at most these; its publish job needs them.
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
    uses: ./.github/workflows/hardware.yml
    with:
      suite: ec2-cpu
      groups: cpu,passmark
      runners: ${{ inputs.runners || '' }}
      iterations: ${{ inputs.iterations || '' }}
